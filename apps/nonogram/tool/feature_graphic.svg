<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic (1024x500, required).
       Play crops and overlays this in several places, so nothing important
       goes near the edges and the board sits off-centre with the wordmark
       given room. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- board: a 5x5 nonogram mid-solve, revealing the heart -->
  <g transform="translate(96 90)">
    <rect x="0" y="0" width="320" height="320" rx="26" fill="#FFFFFF"/>

    <!-- column clues -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
       font-size="26" text-anchor="middle" fill="#475569">
      <text x="85" y="48">2</text>
      <text x="135" y="48">4</text>
      <text x="185" y="48">4</text>
      <text x="235" y="48">4</text>
      <text x="285" y="48">2</text>
    </g>
    <!-- row clues -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
       font-size="26" text-anchor="end" fill="#475569">
      <text x="48" y="94">1 1</text>
      <text x="48" y="144">5</text>
      <text x="48" y="194">5</text>
      <text x="48" y="244">3</text>
      <text x="48" y="294">1</text>
    </g>

    <!-- filled cells: the heart -->
    <g fill="#2563EB">
      <rect x="110" y="60" width="46" height="46" rx="8"/>
      <rect x="210" y="60" width="46" height="46" rx="8"/>
      <rect x="60"  y="110" width="46" height="46" rx="8"/>
      <rect x="110" y="110" width="46" height="46" rx="8"/>
      <rect x="160" y="110" width="46" height="46" rx="8"/>
      <rect x="210" y="110" width="46" height="46" rx="8"/>
      <rect x="260" y="110" width="46" height="46" rx="8"/>
      <rect x="60"  y="160" width="46" height="46" rx="8"/>
      <rect x="110" y="160" width="46" height="46" rx="8"/>
      <rect x="160" y="160" width="46" height="46" rx="8"/>
      <rect x="210" y="160" width="46" height="46" rx="8"/>
      <rect x="260" y="160" width="46" height="46" rx="8"/>
      <rect x="110" y="210" width="46" height="46" rx="8"/>
      <rect x="160" y="210" width="46" height="46" rx="8"/>
      <rect x="210" y="210" width="46" height="46" rx="8"/>
      <rect x="160" y="260" width="46" height="46" rx="8"/>
    </g>

    <!-- X marks on cells known to be blank -->
    <g stroke="#94A3B8" stroke-width="6" stroke-linecap="round">
      <line x1="72"  y1="72"  x2="94"  y2="94"/>
      <line x1="94"  y1="72"  x2="72"  y2="94"/>
      <line x1="272" y1="72"  x2="294" y2="94"/>
      <line x1="294" y1="72"  x2="272" y2="94"/>
      <line x1="72"  y1="272" x2="94"  y2="294"/>
      <line x1="94"  y1="272" x2="72"  y2="294"/>
      <line x1="272" y1="272" x2="294" y2="294"/>
      <line x1="294" y1="272" x2="272" y2="294"/>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="480" y="215" font-size="62" font-weight="700">Nonogram Daily</text>
    <text x="480" y="272" font-size="38" font-weight="400" opacity="0.92">Picture cross puzzles</text>
    <text x="482" y="336" font-size="27" font-weight="400" opacity="0.78">Solve with logic · Watch the picture appear</text>
    <text x="482" y="376" font-size="27" font-weight="400" opacity="0.78">A fresh challenge every day</text>
  </g>
</svg>
