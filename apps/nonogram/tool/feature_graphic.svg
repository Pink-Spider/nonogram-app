<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic (1024x500, required).
       Play crops and overlays this in several places, so nothing important
       goes near the edges and the board sits off-centre with the wordmark
       given room. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- board -->
  <g transform="translate(96 90)">
    <rect x="0" y="0" width="320" height="320" rx="26" fill="#FFFFFF"/>
    <rect x="0" y="107" width="107" height="106" fill="#BBDEFB"/>
    <g stroke="#1E293B" stroke-width="12" stroke-linecap="butt">
      <line x1="107" y1="0" x2="107" y2="320"/>
      <line x1="213" y1="0" x2="213" y2="320"/>
      <line x1="0" y1="107" x2="320" y2="107"/>
      <line x1="0" y1="213" x2="320" y2="213"/>
    </g>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
       font-size="78" text-anchor="middle" fill="#1E293B">
      <text x="53" y="80">5</text>
      <text x="266" y="80">9</text>
      <text x="160" y="187">7</text>
      <text x="53" y="294">1</text>
      <text x="266" y="294">3</text>
    </g>
    <text x="53" y="187" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="78" text-anchor="middle" fill="#1565C0">4</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="480" y="215" font-size="76" font-weight="700">Sudoku Daily</text>
    <text x="480" y="272" font-size="38" font-weight="400" opacity="0.92">Classic logic puzzles</text>
    <text x="482" y="336" font-size="27" font-weight="400" opacity="0.78">A new puzzle every day · Four difficulties</text>
    <text x="482" y="376" font-size="27" font-weight="400" opacity="0.78">Hints that explain the reasoning</text>
  </g>
</svg>
